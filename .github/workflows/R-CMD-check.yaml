# NOTE: This workflow is overkill for most R packages
# check-standard.yaml is likely a better choice
# usethis::use_github_action("check-standard") will install it.
#
# For help debugging build failures open an issue on the RStudio community with the 'github-actions' tag.
# https://community.rstudio.com/new-topic?category=Package%20development&tags=github-actions
on:
  push:
    branches:
      - devel
      - stable
      - release/*
      - feature/*
  pull_request:
    branches:
      - devel

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    # Fail jobs that hang, e.g. in apt-get on the runner, instead of
    # waiting for the six hour limit
    timeout-minutes: 120

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macOS-latest, r: 'devel'}
          - {os: windows-latest, r: 'devel'}
          - {os: ubuntu-latest, r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest, r: 'release'}
          - {os: ubuntu-latest, r: 'oldrel-1'}

    env:
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true
          extra-repositories: "https://inla.r-inla-download.org/R/testing"
            #          extra-repositories: "https://inla.r-inla-download.org/R/testing https://inlabru-org.r-universe.dev"

      - name: Install system dependencies on MacOS (X11, gdal, gsl)
        if: runner.os == 'macOS'
        run: |
          brew install --cask xquartz
          brew install pkg-config
          brew install proj@9
          brew install gdal
          brew install gsl
          # The header omp.h, so that the package is built with OpenMP using the
          # runtime shipped with R (see configure.ac)
          brew install libomp
          # There are no binary packages for R-devel on macOS, so the
          # dependencies are built from source and need these libraries
          # (units, systemfonts, textshaping, s2, svglite, dotCall64)
          brew install udunits freetype harfbuzz fribidi abseil libpng gettext

      - name: Let source packages find the Homebrew libraries on MacOS
        if: runner.os == 'macOS'
        run: |
          # R only looks for headers and libraries in /opt/R/arm64, where the
          # CRAN build machine has them, so packages that do not use
          # pkg-config (such as dotCall64, which needs libintl.h) do not find
          # the ones from Homebrew. libomp is keg-only, so this does not
          # change which OpenMP header or runtime the package uses.
          mkdir -p ~/.R
          echo "CPPFLAGS += -I$(brew --prefix)/include" >> ~/.R/Makevars
          echo "LDFLAGS += -L$(brew --prefix)/lib" >> ~/.R/Makevars
          cat ~/.R/Makevars

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"all"'
          # remotes is not needed here, and pulls in git2r (a suggested package
          # of remotes), which fails to build from source on macOS R-devel
          extra-packages: |
             rcmdcheck
             rmarkdown

      - name: Session info
        run: |
          options(width = 100)
          pkgs <- installed.packages()[, "Package"]
          sessioninfo::session_info(pkgs, include_base = TRUE)
        shell: Rscript {0}

#      - name: Build and check (Linux or macOS)
#        if: runner.os != 'Windows'
      - uses: r-lib/actions/check-r-package@v2
        env:
          _R_CHECK_CRAN_INCOMING_REMOTE_: false
        with:
          args: 'c("--no-manual", "--as-cran")'
