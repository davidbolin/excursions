url: https://davidbolin.github.io/excursions/

destination: docs

template:
  bootstrap: 5
  bootswatch: flatly
  theme: arrow-light
  bslib:
    heading_font: {google: "Roboto Slab"}

navbar:
  bg: primary
  structure:
    left:  [intro, reference, articles, news]
    right: [search, github, twitter]
  components:
    reference:
      text: Functions
      href: reference/index.html
    articles:
      text: Vignettes
      menu:
      - text: INLA interface
        href: articles/inla.html
      - text: inlabru interface
        href: articles/inlabru.html
      - text: Methodology and definitions
        href: articles/theory.html
    
    twitter:
      icon: fa-twitter
      href: https://twitter.com/jdavidbolin
      aria-label: Twitter

home:
  links:
  - text: Our research group
    href: http://stochproc.kaust.edu.sa/

reference:
  - title: excursions package
    contents:
    - excursions-package
  - title: main functions
    contents:
    - excursions
    - simconf
    - contourmap
    - gaussint
    - continuous
    - simconf.mixture
  - title: INLA interface
    contents:
    - excursions.inla
    - contourmap.inla
    - simconf.inla
  - title: Monte Carlo methods
    contents:
    - excursions.mc
    - simconf.mc
    - contourmap.mc
  - title: Visualization
    contents:
    - contourmap.colors
  - title: Geometry methods
    contents:
    - tricontour
    - submesh.grid
    - submesh.mesh
  - title: Utility functions
    contents:
    - exc_safe_inla
    - excursions.variances
    - local_exc_testthat
    - require.nowarnings
    - summary.excurobj
